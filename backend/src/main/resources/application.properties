# Tu dong doc file ca nhan application-local.properties
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:./backend/application-local.properties
spring.application.name=srs-analyzer
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:srs_analyzer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
llm.api.key=${LLM_API_KEY:}
llm.api.model=${LLM_MODEL:gemini-3.6-flash}

app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}

# Upload Word (toi da 100.000 tu ~ vai MB)
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Gui email: bat khi co spring.mail.host. Local: dien trong application-local.properties.
# Deploy: dat bien moi truong SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD (khong ghi mat khau vao file nay).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# spring.mail.properties.mail.debug=true   (bo dau # de xem log SMTP chi tiet khi can)
