spring.application.name=srs-analyzer
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:srs_analyzer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
llm.api.key=${LLM_API_KEY:}
llm.api.model=${LLM_MODEL:gemini-3.6-flash}

app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}
